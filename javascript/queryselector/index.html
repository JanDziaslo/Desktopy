<h1>Zadanie 4</h1>

<h3>Jaka metoda służy do pobrania elementu HTML za pomocą selektora CSS?</h3>

<input type="radio" name="metoda" id="get" value="getElementById()">
<label for="get">getElementById()</label><br>
<input type="radio" name="metoda" id="query" value="querySelector()">
<label for="query">querySelector()</label><br>
<input type="radio" name="metoda" id="getel" value="createElement()">
<label for="getel">createElement()</label><br>
<input type="radio" name="metoda" id="add" value="addEventListener()">
<label for="add">addEventListener()</label><br>
<input type="button" value="Sprawdź" id="metoda" onclick="metoda()">

<div id="wynik3">

</div>
</body>
<script>
    function opa() {
        const wybrana = document.querySelector(
            'input[name="kolor"]:checked'
        );
            if (wybrana) {
                console.log(wybrana.value)
            }
    }

    function jezyk() {
        const wybrana = document.querySelector(
            'input[name="jezyk"]:checked'
        );
            if (wybrana) {
                document.getElementById("wynik").innerHTML = "<p>Wybrany język to: " + wybrana.value + "</p>";
            }
            else {
                document.getElementById("wynik").innerHTML = "<p> wybierz jezyk";
            }
    }
    function ocena() {
        const wybrana = document.querySelector(
            'input[name="ocena"]:checked'
        );
            if (wybrana) {
                document.getElementById("wynik2").innerHTML = "<p>Wybrana ocena to: " + wybrana.value + "</p> <br> dziekujemy za ocene";
            }
            else {
                document.getElementById("wynik2").innerHTML = "<p> wybierz ocene przed wyslaniem";
            }
    }
    function metoda() {
        const wybrana = document.querySelector(
            'input[name="metoda"]:checked'
        );
            if (wybrana.value === "querySelector()" ) {
               document.getElementById("wynik3").innerHTML = "Poprawna odpowiedz!";
            }
            else if (wybrana.value !== "querySelector()" ) {
                document.getElementById("wynik3").innerHTML = "Bledna odpowiedz";
            }
            else {
                document.getElementById("wynik3").innerHTML = "Wybierz odpowiedz";
            }
    }
</script>
