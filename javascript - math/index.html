<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Matematyka w JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="pi.webp" alt="Pi" width="200" height="200"><h1>Matematyka w JS</h1>
    </header>
<main>
    <section id="blizniaki">
        <p>Czy liczby sa bliźniacze?</p>
        <label for="liczba1">Liczba 1:</label>
        <input type="number" id="liczba1" name="liczba1">
        <label for="liczba2">Liczba 2:</label>
        <input type="number" id="liczba2" name="liczba2">
        <button onclick="blizniaki()">Sprawdź</button>
        <p id="wynikBlizniaki"></p>
    </section>
    <section id="cezar">
        <p>Szyfr Ceazara</p>
        <input type="text" id="tekst" placeholder="tekst">
        <button onclick="szyfrCezara()">Szyfruj</button>
        <p id="wynikCezar"></p>
        <button onclick="deszyfrCezara()">Deszyfruj</button>
        <p id="wynikDeszyfrCezar"></p>
    </section>
    <section id="logarytm">
        <p>Logarytm</p>
        <label for="podstawa">Podstawa</label>
        <input type="number" id="podstawa" name="podstawa">
        <label for="log">Logarytmowana</label>
        <input type="number" id="log" name="log">
        <button onclick="logarytm()">Oblicz</button>
        <p id="wynikLogarytm"></p>
    </section>

    <footer>
        <p>Strone wykonał: Jan Dziąsło</p>
    </footer>
</main>
</body>
<script src="script.js"></script>
</html>
